services:
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testdb}
      POSTGRES_USER: ${POSTGRES_USER:-guna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guna}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guna} -d ${POSTGRES_DB:-testdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: library-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Resource-Sharing-Library-Management
    container_name: library-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-testdb}
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: ${POSTGRES_USER:-guna}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-guna}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ""
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ENDPOINT: ${SUPABASE_ENDPOINT}
      SUPABASE_REGION: ${SUPABASE_REGION}
      SUPABASE_ACCESS_KEY: ${SUPABASE_ACCESS_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./resource-library-frontend
    container_name: library-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
