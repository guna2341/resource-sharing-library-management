spring.application.name=Resource-Sharing-Library-Management-Test

# Use in-memory H2 database for test execution
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Redis in tests
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.username=
spring.data.redis.password=

# Mock Supabase in tests
supabase.url=https://test.supabase.co
supabase.s3.endpoint=https://test.supabase.co/storage/v1/s3
supabase.s3.region=ap-south-1
supabase.s3.access-key=test-access-key
supabase.s3.secret-key=test-secret-key
supabase.s3.buckets.images=images
supabase.s3.buckets.documents=documents

# Recommendation configuration
recommendation.content-weight=0.50
recommendation.preference-weight=0.25
recommendation.network-weight=0.15
recommendation.popularity-weight=0.05
recommendation.freshness-weight=0.05
