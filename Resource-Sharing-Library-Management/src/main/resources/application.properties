spring.application.name=Resource-Sharing-Library-Management
server.port=${PORT:8080}

# Database configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/testdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:guna}
spring.datasource.password=${DB_PASSWORD:guna}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=public
logging.level.root=INFO

# Reject unknown fields
spring.jackson.deserialization.fail-on-unknown-properties=true

# Supabase S3 storage configuration
supabase.url=${SUPABASE_URL:https://fziqmrelkosjdkbyvsij.supabase.co}
supabase.s3.endpoint=${SUPABASE_ENDPOINT:https://fziqmrelkosjdkbyvsij.storage.supabase.co/storage/v1/s3}
supabase.s3.region=${SUPABASE_REGION:ap-south-1}
supabase.s3.access-key=${SUPABASE_ACCESS_KEY:c0d7b6f00a91975c6cda09f423103477}
supabase.s3.secret-key=${SUPABASE_SECRET_KEY:b0a951b5ac957e2266d895b223c506d98f0f3c4d6bb21fa0f6b3dced738797d2}
supabase.s3.buckets.images=images
supabase.s3.buckets.documents=documents

# Redis configuration (Docker local by default)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Hybrid Recommendation Engine Configuration
recommendation.content-weight=0.50
recommendation.preference-weight=0.25
recommendation.network-weight=0.15
recommendation.popularity-weight=0.05
recommendation.freshness-weight=0.05
recommendation.default-limit=10
recommendation.max-limit=50
recommendation.cache-enabled=true